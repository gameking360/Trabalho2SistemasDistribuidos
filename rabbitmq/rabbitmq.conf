## Configuração do RabbitMQ do ambiente local, carregada depois dos padrões da imagem oficial
## (montada em /etc/rabbitmq/conf.d/90-commerce.conf pelo docker-compose.yml).
##
## Credenciais NÃO ficam aqui: usuário, senha e virtual host vêm do arquivo .env (RABBITMQ_DEFAULT_*).
## Exchanges, filas e bindings são declarados pelas próprias aplicações (Commerce.Infrastructure/Topology).

## A imagem oficial libera o usuário guest para a rede; aqui ele volta a aceitar apenas conexões locais.
loopback_users.guest = true

## Logs no console do container (docker compose logs rabbitmq).
log.console = true
log.console.level = info

## ---------------------------------------------------------------------------------------------------------
## TLS (opcional)
## 1. Gere/obtenha os certificados e monte a pasta em /etc/rabbitmq/certs no docker-compose.yml.
## 2. Descomente as linhas abaixo e exponha a porta 5671.
## 3. Nas aplicações: RabbitMq__Tls__Enabled=true, RabbitMq__Port=5671 (e RabbitMq__Tls__ServerName, se necessário).
## ---------------------------------------------------------------------------------------------------------
# listeners.ssl.default = 5671
# ssl_options.cacertfile = /etc/rabbitmq/certs/ca_certificate.pem
# ssl_options.certfile = /etc/rabbitmq/certs/server_certificate.pem
# ssl_options.keyfile = /etc/rabbitmq/certs/server_key.pem
# ssl_options.verify = verify_peer
# ssl_options.fail_if_no_peer_cert = false
## Para aceitar somente conexões criptografadas, desabilite a porta 5672:
# listeners.tcp = none
